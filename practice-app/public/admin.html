<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopLab — Back Office</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <main>
    <h1 data-i18n="admin.title">Back Office</h1>
    <div id="forbidden" class="alert error hidden" role="alert" data-testid="admin-forbidden">403 — You do not have permission to view this page.</div>
    <div id="admin" class="hidden">
      <div class="tabs" role="tablist" aria-label="Admin sections">
        <button role="tab" id="tab-dashboard" aria-controls="panel-dashboard" aria-selected="true" data-testid="tab-dashboard">Dashboard</button>
        <button role="tab" id="tab-products" aria-controls="panel-products" aria-selected="false" data-testid="tab-products">Products</button>
        <button role="tab" id="tab-orders" aria-controls="panel-orders" aria-selected="false" data-testid="tab-orders">Orders</button>
        <button role="tab" id="tab-users" aria-controls="panel-users" aria-selected="false" data-testid="tab-users">Users</button>
      </div>

      <section role="tabpanel" id="panel-dashboard" aria-labelledby="tab-dashboard">
        <div class="stats" id="stats" data-testid="stats"></div>
      </section>

      <section role="tabpanel" id="panel-products" aria-labelledby="tab-products" hidden>
        <div class="row" style="margin-bottom:1rem">
          <div class="field grow" style="margin:0"><label for="product-filter">Filter</label><input id="product-filter" type="search" placeholder="SKU or name" data-testid="admin-product-filter"></div>
          <button class="btn primary" type="button" id="add-product" data-testid="add-product">+ Add product</button>
          <a class="btn" href="/api/admin/products/export.csv" data-testid="export-products">Export CSV</a>
        </div>
        <form id="import-form" class="row card" style="margin-bottom:1rem" data-testid="import-form">
          <div class="field grow" style="margin:0"><label for="import-file">Import products from CSV</label><input id="import-file" name="file" type="file" accept=".csv,text/csv" data-testid="import-file"></div>
          <button class="btn" type="submit" data-testid="import-button">Upload</button>
          <div id="import-result" class="grow" data-testid="import-result" role="status"></div>
        </form>
        <div class="card" style="overflow-x:auto">
          <table data-testid="admin-products-table">
            <thead><tr><th>ID</th><th>SKU</th><th>Name</th><th>Category</th><th class="right-align">Price</th><th class="right-align">Stock</th><th>Active</th><th>Actions</th></tr></thead>
            <tbody id="products-body"></tbody>
          </table>
        </div>
      </section>

      <section role="tabpanel" id="panel-orders" aria-labelledby="tab-orders" hidden>
        <div class="card" style="overflow-x:auto">
          <table data-testid="admin-orders-table">
            <thead><tr><th>Order no.</th><th>Customer ID</th><th>Status</th><th class="right-align">Total</th><th>Change status</th></tr></thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
      </section>

      <section role="tabpanel" id="panel-users" aria-labelledby="tab-users" hidden>
        <div class="card" style="overflow-x:auto">
          <table data-testid="admin-users-table">
            <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Failed logins</th><th>Action</th></tr></thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="product-modal" class="modal-backdrop hidden" data-testid="product-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title" style="margin-top:0">Add product</h2>
      <form id="product-form" novalidate>
        <input type="hidden" name="id">
        <div class="row">
          <div class="field grow"><label for="pf-sku">SKU</label><input id="pf-sku" name="sku" type="text" placeholder="ABCD-123" data-testid="pf-sku"><span class="field-error" data-testid="error-sku"></span></div>
          <div class="field grow"><label for="pf-category">Category</label>
            <select id="pf-category" name="category" data-testid="pf-category"><option value="">--</option><option>books</option><option>electronics</option><option>fashion</option><option>home</option><option>sports</option></select>
            <span class="field-error" data-testid="error-category"></span></div>
        </div>
        <div class="field"><label for="pf-name">Name (EN)</label><input id="pf-name" name="name" type="text" data-testid="pf-name"><span class="field-error" data-testid="error-name"></span></div>
        <div class="field"><label for="pf-nameTh">Name (TH)</label><input id="pf-nameTh" name="nameTh" type="text" data-testid="pf-name-th"></div>
        <div class="row">
          <div class="field grow"><label for="pf-price">Price</label><input id="pf-price" name="price" type="number" step="0.01" min="0" data-testid="pf-price"><span class="field-error" data-testid="error-price"></span></div>
          <div class="field grow"><label for="pf-stock">Stock</label><input id="pf-stock" name="stock" type="number" step="1" min="0" data-testid="pf-stock"><span class="field-error" data-testid="error-stock"></span></div>
        </div>
        <div class="field"><label for="pf-description">Description</label><textarea id="pf-description" name="description" rows="2" data-testid="pf-description"></textarea></div>
        <div id="pf-error" class="alert error hidden" role="alert" data-testid="product-form-error"></div>
        <div class="row"><button class="btn primary" type="submit" data-testid="pf-save">Save</button><button class="btn" type="button" id="pf-cancel" data-testid="pf-cancel">Cancel</button></div>
      </form>
    </div>
  </div>

  <div id="confirm-modal" class="modal-backdrop hidden" data-testid="confirm-modal">
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" style="margin-top:0">Please confirm</h2>
      <p id="confirm-text"></p>
      <div class="row"><button class="btn danger" type="button" id="confirm-yes" data-testid="confirm-yes">Yes, delete</button><button class="btn" type="button" id="confirm-no" data-testid="confirm-no">Cancel</button></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
