<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopLab — Product</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <main>
    <p><a href="/" data-testid="back-to-products">← Back to products</a></p>
    <div id="not-found" class="alert error hidden" role="alert" data-testid="product-not-found">Product not found</div>
    <article id="product" class="card hidden" data-testid="product-detail">
      <div class="row" style="align-items:flex-start">
        <img id="p-image" src="" alt="" width="220" height="180" style="object-fit:contain;background:#eef1f8;border-radius:8px">
        <div class="grow stack">
          <h1 id="p-name" data-testid="product-title"></h1>
          <div class="muted">SKU: <span id="p-sku" data-testid="product-sku"></span> · <span id="p-category" class="tag"></span></div>
          <div class="price" style="font-size:1.6rem;font-weight:700;color:var(--primary)" id="p-price" data-testid="product-price"></div>
          <div><span id="p-stock" data-testid="product-stock"></span></div>
          <p id="p-desc"></p>
          <form id="add-form" class="row" data-testid="add-to-cart-form">
            <div class="field" style="margin:0">
              <label for="qty">Quantity</label>
              <div class="row" style="gap:.25rem">
                <button class="btn small" type="button" id="qty-minus" data-testid="qty-minus" aria-label="Decrease quantity">−</button>
                <input id="qty" name="qty" type="number" min="1" max="10" value="1" style="width:70px" data-testid="qty-input">
                <button class="btn small" type="button" id="qty-plus" data-testid="qty-plus" aria-label="Increase quantity">+</button>
              </div>
            </div>
            <button class="btn primary" type="submit" id="add-btn" data-testid="add-to-cart">Add to cart</button>
          </form>
          <div class="field-error" data-testid="qty-error" role="alert"></div>
        </div>
      </div>
    </article>

    <section id="reviews-section" class="card hidden" style="margin-top:1rem" aria-labelledby="reviews-title">
      <h2 id="reviews-title">Reviews (<span data-testid="review-count">0</span>)</h2>
      <div id="reviews" data-testid="review-list"></div>
      <form id="review-form" class="hidden" data-testid="review-form" style="margin-top:1rem">
        <h3>Write a review</h3>
        <div class="field">
          <label for="rating">Rating</label>
          <select id="rating" name="rating" data-testid="review-rating">
            <option value="5">★★★★★ (5)</option><option value="4">★★★★ (4)</option><option value="3">★★★ (3)</option>
            <option value="2">★★ (2)</option><option value="1">★ (1)</option>
          </select>
        </div>
        <div class="field">
          <label for="comment">Comment</label>
          <textarea id="comment" name="comment" rows="3" maxlength="500" data-testid="review-comment"></textarea>
          <span class="hint"><span data-testid="review-char-count">0</span>/500</span>
          <span class="field-error" data-testid="error-comment"></span>
        </div>
        <button class="btn primary" type="submit" data-testid="review-submit">Submit review</button>
      </form>
      <p id="review-login" class="muted hidden"><a href="/login">Login</a> to write a review.</p>
    </section>
  </main>
  <script src="/js/common.js"></script>
  <script>
  (async () => {
    const { api, money, esc, qs, toast, me, config, refreshCartCount, errMsg } = window.SL;
    await window.SL.renderHeader('products');
    const id = Number(qs('id'));
    const r = await api(`/products/${id}`);
    if (!r.ok) { document.getElementById('not-found').classList.remove('hidden'); return; }
    const p = r.data;
    const user = await me();
    const cfg = await config();
    document.title = `ShopLab — ${p.name}`;
    document.getElementById('p-name').textContent = window.SL.lang() === 'th' ? p.nameTh : p.name;
    document.getElementById('p-sku').textContent = p.sku;
    document.getElementById('p-category').textContent = p.category;
    document.getElementById('p-price').textContent = money(p.price);
    document.getElementById('p-desc').textContent = p.description;
    const img = document.getElementById('p-image'); img.src = p.image; img.alt = p.name;
    const stock = document.getElementById('p-stock');
    stock.textContent = p.inStock ? `In stock: ${p.stock}` : 'Out of stock';
    stock.className = p.inStock ? 'tag' : 'tag out';
    document.getElementById('add-btn').disabled = !p.inStock;
    document.getElementById('product').classList.remove('hidden');

    const qty = document.getElementById('qty');
    const clamp = (v) => Math.max(1, Math.min(10, v));
    document.getElementById('qty-minus').onclick = () => { qty.value = clamp(Number(qty.value) - 1); };
    document.getElementById('qty-plus').onclick = () => { qty.value = clamp(Number(qty.value) + 1); };
    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.querySelector('[data-testid="qty-error"]');
      errEl.textContent = '';
      const n = Number(qty.value);
      if (!Number.isInteger(n) || n < 1 || n > 10) { errEl.textContent = 'Quantity must be 1-10'; return; }
      if (!user) { location.href = `/login?next=${encodeURIComponent(location.pathname + location.search)}`; return; }
      const res = await api('/cart/items', { method: 'POST', body: { productId: p.id, qty: n } });
      if (res.ok) { toast(`Added ${n} × ${p.name} to cart`, 'success'); refreshCartCount(); } else errEl.textContent = errMsg(res);
    });

    function renderReviews(list) {
      document.querySelector('[data-testid="review-count"]').textContent = list.length;
      document.getElementById('reviews').innerHTML = list.length ? list.map((rv) => `
        <div class="review" data-testid="review-item">
          <div><strong data-testid="review-author">${esc(rv.username)}</strong> <span class="stars">${'★'.repeat(rv.rating)}${'☆'.repeat(5 - rv.rating)}</span></div>
          <div class="review-comment" data-testid="review-text">${cfg.bugMode || (cfg.activeBugs || []).includes('BUG-09') ? rv.comment : esc(rv.comment)}</div>
        </div>`).join('') : '<p class="muted" data-testid="no-reviews">No reviews yet.</p>';
    }
    renderReviews(p.reviews);
    document.getElementById('reviews-section').classList.remove('hidden');
    if (user) document.getElementById('review-form').classList.remove('hidden');
    else document.getElementById('review-login').classList.remove('hidden');

    const comment = document.getElementById('comment');
    comment.addEventListener('input', () => { document.querySelector('[data-testid="review-char-count"]').textContent = comment.value.length; });
    document.getElementById('review-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await api(`/products/${p.id}/reviews`, { method: 'POST', body: { rating: Number(document.getElementById('rating').value), comment: comment.value } });
      if (!res.ok) { window.SL.showFieldErrors(e.target, res.data.error.details || { comment: errMsg(res) }); return; }
      window.SL.showFieldErrors(e.target, {});
      comment.value = '';
      document.querySelector('[data-testid="review-char-count"]').textContent = '0';
      const fresh = await api(`/products/${p.id}`);
      renderReviews(fresh.data.reviews);
      toast('Review submitted', 'success');
    });
  })();
  </script>
</body>
</html>
