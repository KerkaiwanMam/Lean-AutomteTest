<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopLab — Products</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <main>
    <h1 data-i18n="catalog.title">Products</h1>
    <div class="layout-catalog">
      <aside class="card" aria-label="Filters">
        <form id="filter-form" data-testid="filter-form">
          <div class="field">
            <label for="search" data-i18n="catalog.search">Search products</label>
            <input id="search" name="search" type="search" data-testid="search-input" autocomplete="off" data-i18n-placeholder="catalog.search">
          </div>
          <div class="field">
            <label for="category" data-i18n="catalog.category">Category</label>
            <select id="category" name="category" data-testid="category-select">
              <option value="" data-i18n="catalog.all">All categories</option>
            </select>
          </div>
          <div class="field">
            <label for="sort" data-i18n="catalog.sort">Sort by</label>
            <select id="sort" name="sort" data-testid="sort-select">
              <option value="name_asc">Name (A–Z)</option>
              <option value="name_desc">Name (Z–A)</option>
              <option value="price_asc">Price (low to high)</option>
              <option value="price_desc">Price (high to low)</option>
              <option value="rating_desc">Top rated</option>
              <option value="newest">Newest</option>
            </select>
          </div>
          <div class="row">
            <div class="field grow">
              <label for="minPrice" data-i18n="catalog.minPrice">Min price</label>
              <input id="minPrice" name="minPrice" type="number" min="0" data-testid="min-price">
            </div>
            <div class="field grow">
              <label for="maxPrice" data-i18n="catalog.maxPrice">Max price</label>
              <input id="maxPrice" name="maxPrice" type="number" min="0" data-testid="max-price">
            </div>
          </div>
          <div class="field">
            <label class="inline-options"><input type="checkbox" id="inStock" name="inStock" value="true" data-testid="in-stock-checkbox"> <span data-i18n="catalog.inStock">In stock only</span></label>
          </div>
          <div class="row">
            <button class="btn primary" type="submit" data-testid="search-button" data-i18n="catalog.searchBtn">Search</button>
            <button class="btn" type="button" id="clear-filters" data-testid="clear-filters" data-i18n="catalog.clear">Clear</button>
          </div>
        </form>
      </aside>
      <section aria-label="Results">
        <p class="muted" data-testid="result-summary" aria-live="polite"></p>
        <div id="loading" data-testid="loading" class="spinner hidden" role="progressbar" aria-label="Loading products"></div>
        <div id="error" class="alert error hidden" data-testid="catalog-error" role="alert">
          <span id="error-text"></span>
          <button class="btn small" type="button" id="retry" data-testid="retry-button">Retry</button>
        </div>
        <p id="empty" class="alert info hidden" data-testid="empty-state" data-i18n="catalog.empty">No products found</p>
        <div id="grid" class="product-grid" data-testid="product-grid"></div>
        <nav id="pagination" class="pagination" aria-label="Pagination" data-testid="pagination"></nav>
      </section>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/catalog.js"></script>
</body>
</html>
